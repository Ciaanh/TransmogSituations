# Runs the Lua 5.1 replay suite (tests/run.sh) on every push to main and every pull request.
# release.yml calls it too, so a tag whose suite fails is never published.
name: Tests

on:
  push:
    branches:
      - main
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Lua 5.1
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends lua5.1

      - name: Run the replay suite
        run: ./tests/run.sh
        env:
          LUA: lua5.1
          LUAC: luac5.1
